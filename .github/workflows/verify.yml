name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Mac only, like the app: the smoke runs drive a real Electron window.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # package.json's allowScripts field needs npm 12.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run verify
